<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hand curl verification</title>
    <style>
      body { margin: 0; background: #14161a; color: #e8eaed; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      h1 { font-size: 15px; margin: 14px 16px 2px; font-weight: 600; }
      p.sub { margin: 0 16px 12px; color: #9aa0a6; font-size: 12px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 18px; }
      .cell { background: #1c1f24; border: 1px solid #2a2e35; border-radius: 6px; padding: 6px; }
      .cell canvas { display: block; border-radius: 4px; background: #0e1013; }
      .lab { margin-top: 5px; font-variant-numeric: tabular-nums; font-size: 11px; }
      .lab b { color: #7fd1ff; font-weight: 600; }
      .lab .m { color: #9dffb0; }
      .lab .d { color: #f5c46b; }
      .lab .j { color: #9aa0a6; display: block; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module" src="./handcheck.ts"></script>
  </body>
</html>
